<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifying · CODLYTIC</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050812;color:#eaf7ff;font:16px system-ui}.card{padding:30px;border:1px solid #38516d;border-radius:18px;background:#0c1425;text-align:center}.muted{color:#aab6ce}</style></head><body><main class="card"><h2>Verifying your email…</h2><p class="muted" id="status">Please wait while we securely complete sign-in.</p></main><script>
(async()=>{const p=new URLSearchParams(location.hash.slice(1));const access=p.get("access_token"),refresh=p.get("refresh_token"),error=p.get("error_description");if(error)throw new Error(error);if(!access||!refresh)throw new Error("Confirmation link is incomplete or expired. Please sign in again.");const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"store-session",access_token:access,refresh_token:refresh,expires_in:p.get("expires_in")})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not verify session.");history.replaceState(null,"",location.pathname);location.replace("/dashboard")})().catch(e=>document.getElementById("status").textContent=e.message);
</script></body></html>
