<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · CODLYTIC</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050812;color:#f4f7ff;font:16px system-ui}.card{width:min(420px,100%);padding:30px;border:1px solid #38516d;border-radius:20px;background:#0c1425}.muted{color:#aab6ce}.field{display:grid;gap:7px;margin:16px 0}input{padding:12px;border-radius:10px;border:1px solid #344963;background:#070e1c;color:white}button{width:100%;padding:12px;border:1px solid #79dfff;border-radius:10px;background:#1b526d;color:white;font-weight:700;cursor:pointer}.status{margin-top:12px;color:#b8d9e9}</style></head><body><main class="card"><h2>Choose a new password</h2><p class="muted">Use at least 8 characters.</p><form id="form"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button id="submit">Update password</button></form><div class="status" id="status"></div></main><script>
const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get("access_token");const refresh=hash.get("refresh_token");const type=hash.get("type");if(!access||type!=="recovery")document.getElementById("status").textContent="Open the password reset link from your email again.";document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("submit");b.disabled=true;try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"update-password",access_token:access,refresh_token:refresh,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById("status").textContent="Password updated. You can now sign in.";setTimeout(()=>location.assign("/login.html"),1300)}catch(err){document.getElementById("status").textContent=err.message}finally{b.disabled=false}};
</script></body></html>
