<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070912"><title>Sign in · CODLYTIC</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 15%,#17334e 0,transparent 42%),radial-gradient(ellipse at 85% 80%,#38265d 0,transparent 40%),#050812;color:#f4f7ff;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(440px,100%);padding:32px;border:1px solid #38516d;border-radius:24px;background:#0c1425ee;box-shadow:0 25px 80px #0009}.brand{color:#8be9ff;font-weight:900;letter-spacing:.22em;font-size:.8rem}.eyebrow{margin-top:22px;color:#8be9ff;font-size:.7rem;letter-spacing:.18em}.title{font-size:2rem;margin:4px 0}.muted{color:#aab6ce;font-size:.92rem}.tabs{display:flex;gap:8px;margin:22px 0}.tab,button{border:1px solid #35516d;border-radius:12px;padding:10px 14px;background:#13243a;color:#eaf7ff;cursor:pointer;font-weight:650}.tab.active,button.primary{background:#1b526d;border-color:#79dfff}.tab{flex:1}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:.82rem;color:#c5d2e6}.field input{width:100%;padding:12px 13px;border:1px solid #344963;border-radius:11px;background:#070e1c;color:white;font:inherit;outline:none}.field input:focus{border-color:#8be9ff;box-shadow:0 0 0 3px #8be9ff18}.primary{width:100%;margin-top:8px;padding:13px}.subtle{background:transparent;border:0;color:#8be9ff;padding:8px 0}.status{min-height:26px;margin-top:12px;color:#b8d9e9;font-size:.85rem}.back{display:inline-block;margin-top:18px;color:#9db3cc;font-size:.85rem}.hidden{display:none!important}.hint{font-size:.78rem;color:#8f9fb8;margin-top:10px}
</style></head><body><main class="card"><div class="brand">CODLYTIC</div><div class="eyebrow">YOUR PERSONAL DIGITAL SPACE</div><h1 class="title" id="heading">Welcome back</h1><p class="muted">Sign in to continue to your private Galaxy dashboard.</p><div class="tabs"><button class="tab active" id="loginTab" type="button">Sign in</button><button class="tab" id="signupTab" type="button">Create account</button></div>
<form id="authForm"><div class="field" id="nameField"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" maxlength="80"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button class="primary" id="submit" type="submit">Sign in</button></form><button class="subtle" id="forgot" type="button">Forgot password?</button><div class="status" id="status" role="status" aria-live="polite"></div><div class="hint">Use at least 8 characters. New accounts may need email confirmation.</div><a class="back" href="/">← Back to CODLYTIC Galaxy</a></main>
<script>
const $=id=>document.getElementById(id);let mode="signin";const params=new URLSearchParams(location.search);let next=params.get("next")||"/dashboard";if(!next.startsWith("/")||next.startsWith("//"))next="/dashboard";
function setMode(value){mode=value;$("loginTab").classList.toggle("active",mode==="signin");$("signupTab").classList.toggle("active",mode==="signup");$("nameField").classList.toggle("hidden",mode!=="signup");$("heading").textContent=mode==="signin"?"Welcome back":"Create your account";$("submit").textContent=mode==="signin"?"Sign in":"Create account";$("forgot").classList.toggle("hidden",mode!=="signin");$("password").autocomplete=mode==="signin"?"current-password":"new-password";$("status").textContent=""}
$("loginTab").onclick=()=>setMode("signin");$("signupTab").onclick=()=>setMode("signup");setMode("signin");
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="Please wait…";try{const res=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:mode,email:$("email").value.trim(),password:$("password").value,fullName:$("fullName").value.trim()})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Authentication failed.");$("status").textContent=data.message;if(mode==="signin"||data.message.includes("signed in"))location.assign(next)}catch(err){$("status").textContent=err.message}finally{$("submit").disabled=false}});
$("forgot").onclick=async()=>{const email=$("email").value.trim();if(!email){$("status").textContent="Enter your email address first.";return}try{const r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"recover",email})});const d=await r.json();if(!r.ok)throw new Error(d.error);$("status").textContent=d.message}catch(e){$("status").textContent=e.message}};
</script></body></html>
